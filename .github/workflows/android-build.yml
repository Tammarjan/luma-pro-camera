name: Luma Pro Camera - Final Test Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Luma Pro Camera 1.0.0 test APK
        uses: actions/upload-artifact@v4
        with:
          name: luma-pro-camera-v1.0.0-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-install APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Luma Pro Camera Test Build ${{ github.run_number }}
          body: |
            Direct-install test APK for Luma Pro Camera.
            Download the APK asset below and install it on Android. No ZIP extraction is needed.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
